name: PeriPage A40 Print
version: "0.1.8"
slug: peripage_a40
description: App-free, cloud-free LAN printing to a PeriPage A40 thermal printer over Bluetooth.
url: https://github.com/paul43210/ha-peripage-a40
arch:
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-pos
panel_title: PeriPage
# Bluetooth access to the host's Sena dongle. AF_BLUETOOTH sockets can ONLY be
# created in the host network namespace -- in bridge mode socket() fails with
# errno 97 (EAFNOSUPPORT) -- so host_network is required.
host_network: true
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
options:
  # REQUIRED: set this to your printer Bluetooth MAC (see the docs).
  printer_mac: ""
  rfcomm_channel: 1
  dither: true
schema:
  printer_mac: str
  rfcomm_channel: int
  dither: bool
